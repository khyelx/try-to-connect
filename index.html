<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Khiel Decena — Links</title>
<style>
:root{
  --bg:#faf9fd;--surface:#ffffff;--text:#1d1830;--muted:#6f6a82;--border:#e8e4f1;--accent:#6d4fd8;--accent2:#ff9e7d;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){--bg:#0f0d16;--surface:#181526;--text:#f1eefa;--muted:#9b95b2;--border:#2a2641;--accent:#a78bfa;--accent2:#ffb59a}
}
:root[data-theme="dark"]{--bg:#0f0d16;--surface:#181526;--text:#f1eefa;--muted:#9b95b2;--border:#2a2641;--accent:#a78bfa;--accent2:#ffb59a}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font-family:Inter,system-ui,-apple-system,"Segoe UI",sans-serif;min-height:100vh;display:flex;justify-content:center}
main{width:100%;max-width:440px;padding:56px 20px 40px;text-align:center}
.avatar{width:88px;height:88px;border-radius:50%;margin:0 auto 18px;display:grid;place-items:center;background:var(--accent);color:var(--bg);font-size:36px;font-weight:600}
h1{font-size:26px;margin:0 0 6px;letter-spacing:-.01em}
.tag{color:var(--muted);margin:0 0 14px;font-size:15px}
.bio{color:var(--muted);font-size:14.5px;line-height:1.55;margin:0 auto 32px;max-width:340px}
.links{display:flex;flex-direction:column;gap:12px}
.link{display:flex;align-items:center;justify-content:space-between;padding:16px 18px;background:var(--surface);border:1px solid var(--border);border-radius:14px;color:var(--text);text-decoration:none;font-weight:500;font-size:15.5px;transition:transform .15s,border-color .15s}
.link:hover{transform:translateY(-2px);border-color:var(--accent)}
.link span.arrow{color:var(--muted);transition:color .15s}
.link:hover span.arrow{color:var(--accent2)}
a.soon{opacity:.55;border-style:dashed;pointer-events:none}
button.link{width:100%;font-family:inherit;cursor:pointer;text-align:left;appearance:none;-webkit-appearance:none}
img.avatar{display:block;object-fit:cover;width:104px;height:104px;border:2px solid var(--accent);padding:3px;background:var(--bg);box-shadow:0 0 0 4px color-mix(in srgb,var(--accent2) 35%,transparent)}
html{-webkit-text-size-adjust:100%;text-size-adjust:100%}
body{min-height:100vh;min-height:100dvh;-webkit-tap-highlight-color:transparent}
main{max-width:420px;padding:clamp(28px,7vh,56px) clamp(14px,5vw,22px) clamp(24px,5vh,40px)}
img.avatar{width:clamp(76px,24vw,96px);height:clamp(76px,24vw,96px);margin-bottom:clamp(12px,2.5vh,18px)}
h1{font-size:clamp(21px,6.2vw,26px);overflow-wrap:anywhere}
.tag{font-size:clamp(13.5px,3.8vw,15px)}
.bio{font-size:clamp(13.5px,3.7vw,14.5px);margin-bottom:clamp(20px,4vh,32px)}
.links{gap:clamp(9px,2vh,12px)}
.link{min-height:52px;padding:12px 16px;font-size:clamp(14.5px,4vw,15.5px);touch-action:manipulation}
.link:hover{transform:none;border-color:var(--border)}
.link:active{transform:scale(.98);border-color:var(--accent)}
@media (hover:hover){.link:hover{transform:translateY(-2px);border-color:var(--accent)}}
@media (prefers-reduced-motion:reduce){.link{transition:none}}
@media (max-height:480px) and (orientation:landscape){main{padding-top:20px}}
footer{margin-top:36px;font-size:12.5px;color:var(--muted)}
</style>
</head>

<script>
document.querySelectorAll('button[data-copy]').forEach(function(btn){
  btn.addEventListener('click',function(){
    var text=btn.getAttribute('data-copy');
    var label=btn.querySelector('.arrow');
    var original=label.textContent;
    function done(){label.textContent='copied ✓';setTimeout(function(){label.textContent=original},1500)}
    function fallback(){
      var t=document.createElement('textarea');t.value=text;document.body.appendChild(t);t.select();
      try{document.execCommand('copy')}catch(e){}
      document.body.removeChild(t);done();
    }
    if(navigator.clipboard&&navigator.clipboard.writeText){
      navigator.clipboard.writeText(text).then(done,fallback);
    }else{fallback()}
  });
});
</script>
